name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Override icons with custom logo
        run: |
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp -v android-icons/$folder/ic_launcher.png android/app/src/main/res/$folder/ic_launcher.png
            cp -v android-icons/$folder/ic_launcher_round.png android/app/src/main/res/$folder/ic_launcher_round.png
            cp -v android-icons/$folder/ic_launcher_foreground.png android/app/src/main/res/$folder/ic_launcher_foreground.png
          done
          echo "Icons overridden."

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Regalia-Records-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
