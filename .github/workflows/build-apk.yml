name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore (one-time setup)
        run: |
          keytool -genkey -v -keystore regalia.keystore -alias regalia \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Regalia, OU=App, O=Regalia, L=Accra, ST=Greater Accra, C=GH" \
            -storepass regaliakey123 -keypass regaliakey123
          echo "===BASE64START==="
          base64 regalia.keystore
          echo "===BASE64END==="

      - name: Install dependencies
        run: npm install

      - name: Bundle XLSX library offline
        run: |
          curl -L "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" -o www/xlsx.full.min.js
          echo "XLSX bundled: $(wc -c < www/xlsx.full.min.js) bytes"

      - name: Remove Google Fonts dependency
        run: |
          sed -i 's|<link href="https://fonts.googleapis.com[^"]*">||g' www/index.html
          echo "Google Fonts removed."

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Register Capacitor plugins
        run: |
          MAIN=$(find android -name "MainActivity.java" -o -name "MainActivity.kt" 2>/dev/null | head -1)
          echo "MainActivity: $MAIN"
          if [[ "$MAIN" == *.kt ]]; then
            sed -i 's/import com.getcapacitor.BridgeActivity/import com.getcapacitor.BridgeActivity\nimport com.capacitorjs.plugins.app.AppPlugin\nimport com.getcapacitor.community.http.HttpPlugin/' "$MAIN"
            sed -i '/class MainActivity/a\  override fun onCreate(savedInstanceState: android.os.Bundle?) {\n    registerPlugin(AppPlugin::class.java)\n    registerPlugin(HttpPlugin::class.java)\n    super.onCreate(savedInstanceState)\n  }' "$MAIN" || true
          fi
          echo "Plugin registration done"

      - name: Set version
        run: |
          sed -i 's/versionCode [0-9]*/versionCode 42/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.7"/' android/app/build.gradle
          echo "Version set to: $(grep -E 'versionCode|versionName' android/app/build.gradle)"

      - name: Set app name
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Regalia Records Search</string>|g' android/app/src/main/res/values/strings.xml
          echo "App name set to: $(grep app_name android/app/src/main/res/values/strings.xml)"

      - name: Override icons with custom logo
        run: |
          pip install Pillow --break-system-packages -q
          python3 -c "
          from PIL import Image
          import os
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          img = Image.open('www/icon-512.png').convert('RGBA')
          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              bg = Image.new('RGBA', (size,size), (14,15,17,255))
              bg.paste(img.resize((size,size), Image.LANCZOS), (0,0), img.resize((size,size), Image.LANCZOS))
              out = bg.convert('RGB')
              out.save(f'{path}/ic_launcher.png')
              out.save(f'{path}/ic_launcher_round.png')
              out.save(f'{path}/ic_launcher_foreground.png')
              print(f'Done {folder}')
          "

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Regalia-Records-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
